<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cobrar — Nocturna POS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap">
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>

  <!-- La barra de navegacion la pinta el componente navbar.js -->
  <div id="nav"></div>

  <main class="pos">

    <section class="catalog" aria-label="Catálogo de productos">
      <label class="search">
        <svg class="i" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path>
        </svg>
        <input type="search" id="buscador" placeholder="Buscar producto… (ej: fernet, red bull)"
               aria-label="Buscar producto" autocomplete="off">
      </label>

      <div class="cats" id="categorias" aria-label="Filtrar por categoría"></div>

      <div id="catalogo"></div>
    </section>

    <aside class="cart" aria-label="Pedido actual">
      <div class="cart-head">
        <h2 class="cart-title">Pedido actual<span class="cart-count" id="contadorUnidades"></span></h2>
        <button type="button" class="btn btn-ghost" id="btnVaciar">Vaciar</button>
      </div>

      <ul class="cart-list" id="lineas"></ul>

      <div class="cart-foot">
        <div class="total">
          <div>
            <div class="total-label">Total a cobrar</div>
            <div class="total-units" id="totalUnidades"></div>
          </div>
          <div class="total-amount" id="totalMonto">$ 0</div>
        </div>

        <div>
          <div class="section-label">Medio de pago</div>
          <div class="pay-grid" id="mediosPago">
            <button type="button" class="pay-btn is-active" data-medio="efectivo" aria-pressed="true">
              <svg class="i i-lg" viewBox="0 0 24 24" aria-hidden="true"><rect width="20" height="12" x="2" y="6" rx="2"></rect><circle cx="12" cy="12" r="2"></circle><path d="M6 12h.01M18 12h.01"></path></svg>Efectivo
            </button>
            <button type="button" class="pay-btn" data-medio="debito" aria-pressed="false">
              <svg class="i i-lg" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 7V4a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4h-3a2 2 0 0 0 0 4h3a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1"></path><path d="M3 5v14a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-4"></path></svg>Débito
            </button>
            <button type="button" class="pay-btn" data-medio="credito" aria-pressed="false">
              <svg class="i i-lg" viewBox="0 0 24 24" aria-hidden="true"><rect width="20" height="14" x="2" y="5" rx="2"></rect><path d="M2 10h20"></path></svg>Crédito
            </button>
            <button type="button" class="pay-btn" data-medio="qr" aria-pressed="false">
              <svg class="i i-lg" viewBox="0 0 24 24" aria-hidden="true"><rect width="5" height="5" x="3" y="3" rx="1"></rect><rect width="5" height="5" x="16" y="3" rx="1"></rect><rect width="5" height="5" x="3" y="16" rx="1"></rect><path d="M21 16h-3a2 2 0 0 0-2 2v3"></path><path d="M21 21v.01"></path><path d="M12 7v3a2 2 0 0 1-2 2H7"></path><path d="M3 12h.01M12 3h.01M12 16v.01M16 12h1M21 12v.01M12 21v-1"></path></svg>QR
            </button>
            <button type="button" class="pay-btn" data-medio="entrada" aria-pressed="false">
              <svg class="i i-lg" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 9a3 3 0 0 1 0 6v2a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-2a3 3 0 0 1 0-6V7a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2Z"></path><path d="M13 5v2M13 17v2M13 11v2"></path></svg>Entrada
            </button>
          </div>
        </div>

        <!-- Solo se muestra cuando el medio de pago es credito -->
        <div class="sub-panel" id="panelCuotas" hidden>
          <div class="label">Cuotas</div>
          <div class="seg" id="opcionesCuotas">
            <button type="button" class="seg-btn is-active" data-cuotas="1" aria-pressed="true">1</button>
            <button type="button" class="seg-btn" data-cuotas="3" aria-pressed="false">3</button>
            <button type="button" class="seg-btn" data-cuotas="6" aria-pressed="false">6</button>
            <button type="button" class="seg-btn" data-cuotas="12" aria-pressed="false">12</button>
          </div>
          <p class="hint" id="detalleCuota"></p>
        </div>

        <!-- Solo se muestra cuando el medio de pago es entrada -->
        <div class="sub-panel" id="panelEntrada" hidden>
          <label class="label" for="codigoEntrada">Código de la entrada</label>
          <div class="code-row">
            <input id="codigoEntrada" class="input input-code" type="text"
                   placeholder="Ej: ENT-GEN-0001" autocomplete="off">
          </div>
          <p class="hint">Tipeá el código que figura en la entrada del cliente.</p>
        </div>

        <div class="alert alert-danger" id="errorCobro" hidden></div>

        <button type="button" class="btn-cobrar" id="btnCobrar" disabled>
          <span>COBRAR</span><span id="montoBoton">$ 0</span>
        </button>
      </div>
    </aside>

  </main>

  <!-- Confirmacion despues de registrar la venta -->
  <div class="overlay" id="modalExito" hidden>
    <div class="modal">
      <div class="modal-body">
        <div class="success">
          <div class="success-icon">
            <svg class="i i-xl" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg>
          </div>
          <h2 class="modal-title" id="tituloExito">Venta registrada</h2>
          <p class="hint" id="detalleExito"></p>
        </div>
      </div>
      <div class="modal-foot">
        <button type="button" class="btn btn-primary btn-lg" id="btnSeguir">Cobrar otra</button>
      </div>
    </div>
  </div>

  <script type="module" src="./js/index.js"></script>
</body>
</html>
