<!-- front/estadisticas.html -->
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Estadísticas y caja — Nocturna POS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- La barra de navegacion la pinta el componente navbar.js -->
  <div id="nav"></div>

  <main class="page">

    <div class="page-head">
      <div>
        <h1 class="page-title">Estadísticas y caja</h1>
        <p class="page-sub">Apertura, cierre y recaudación de la noche</p>
      </div>
    </div>

    <p id="mensaje" class="alert alert-ok" role="status" hidden></p>

    <section class="card est-panel" id="panel-abrir">
      <h2 class="sec-title">Abrir caja</h2>
      <form id="form-abrir">
        <div class="field">
          <label class="label" for="barra">Barra</label>
          <select id="barra" class="input" required>
            <option value="general">General</option>
            <option value="vip">VIP</option>
          </select>
        </div>
        <div class="field">
          <label class="label" for="fondo-inicial">Fondo inicial</label>
          <input type="number" id="fondo-inicial" class="input" min="0" step="0.01" required>
        </div>
        <button type="submit" class="btn btn-primary btn-lg">Abrir caja</button>
      </form>
    </section>

    <section class="card est-panel" id="panel-cajas">
      <h2 class="sec-title">Cajas abiertas</h2>
      <div id="lista-cajas"></div>
    </section>

    <section class="card est-panel" id="panel-resumen">
      <div class="sec-head">
        <h2 class="sec-title">Recaudación</h2>
        <div class="field">
          <label class="label" for="selector-caja">Caja</label>
          <select id="selector-caja" class="input"></select>
        </div>
      </div>

      <div>
        <p id="total-recaudado" class="kpi-total">$ 0</p>
        <p id="cantidad-ventas" class="hint"></p>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>Medio de pago</th><th>Ventas</th><th>Recaudación</th></tr>
          </thead>
          <tbody id="tabla-medios"></tbody>
        </table>
      </div>
    </section>

  </main>

  <script type="module" src="js/estadisticas.js"></script>
</body>
</html>
